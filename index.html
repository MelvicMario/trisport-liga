<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0f2240" />
  <title>TriSport Liga</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="vuelta.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="logo">TS</div>
      <div style="flex:1">
        <h1>TriSport Liga</h1>
        <p class="lema">Juntos Más Fuertes</p>
      </div>
      <button id="logout" class="btn ghost" style="display:none;width:auto;margin:0;padding:8px 12px">Salir</button>
    </header>

    <main>
      <!-- LOGIN -->
      <section id="view-login" class="view active">
        <div class="card hero" style="margin-top:24px">
          <div class="nm" style="margin-bottom:6px">Entra a la liga</div>
          <p class="hint">Entra con tu cuenta de Google o con tu email de socio.</p>
          <button class="btn" id="googleBtn" style="background:#fff;color:#1f2937;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px">
            <span style="font-weight:900;font-size:18px;color:#4285F4">G</span> Continuar con Google
          </button>
          <div style="text-align:center;color:var(--muted);font-size:12px;margin:14px 0 4px">— o con tu email —</div>
          <input id="email" type="email" inputmode="email" placeholder="tucorreo@ejemplo.com"
                 style="width:100%;padding:13px;border-radius:12px;font-size:15px;background:var(--navy-2);color:#fff;border:1px solid rgba(255,255,255,.14);margin:12px 0" />
          <button class="btn" id="sendLink">Enviar enlace de acceso</button>
          <p class="hint" id="loginMsg" style="margin-top:12px"></p>
        </div>
        <p class="hint" style="text-align:center">Solo pueden entrar los emails autorizados del club.</p>
        <p class="hint" style="text-align:center;opacity:.55;margin-top:4px">TriSport Liga · <span class="appVersion">v37</span></p>
        <div style="text-align:center;margin-top:18px">
          <div style="color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">Patrocinada por</div>
          <span style="display:inline-block;background:#fff;border-radius:12px;padding:12px 18px">
            <img src="ifer.jpg" alt="Industrias IFER" style="height:30px;display:block" /></span>
        </div>
      </section>

      <!-- NOTICIAS -->
      <section id="view-news" class="view">
        <div id="avisoPruebas"></div>
        <div id="vueltaHome"></div>
      </section>

      <!-- MI CASTILLO -->
      <section id="view-base" class="view">
        <div id="baseContent"></div>
      </section>

      <!-- JUGADORES -->
      <section id="view-rank" class="view">
        <div class="seg" id="rankSeg">
          <button data-mode="general" class="active">General</button>
          <button data-mode="equipos">Por equipos</button>
        </div>
        <div id="rankList"></div>
      </section>

      <!-- CÓMO SE JUEGA -->
      <section id="view-help" class="view help">
        <div id="reglamento"></div>
      </section>

      <!-- ADMIN -->
      <section id="view-admin" class="view">
        <h2 class="section">📣 Panel de admin</h2>
        <div id="adminContent"></div>
      </section>
    </main>

    <nav class="tabs" id="tabs" style="display:none">
      <button data-view="news" class="active"><span class="ic">🚴</span>La Vuelta</button>
      <button data-view="base"><span class="ic">👤</span>Mi carrera</button>
      <button data-view="rank"><span class="ic">🏆</span>Clasificación</button>
      <button data-view="help"><span class="ic">❓</span>Cómo</button>
      <button data-view="admin" id="tabAdmin" style="display:none"><span class="ic">📣</span>Admin</button>
    </nav>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
